name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Copy web app to Tauri dist
        shell: bash
        run: |
          cp -r dist desktop-tauri/dist
          cp desktop-tauri/src/quick-add.html desktop-tauri/dist/quick-add.html

      - name: Install Tauri CLI
        working-directory: desktop-tauri
        run: npm ci

      # macOS: Import signing certificate
      - name: Import Apple signing certificate
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          # Also import Apple intermediate cert (ignore if already exists)
          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o /tmp/DeveloperIDG2CA.cer
          security import /tmp/DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH" || true

      # Build with updater signing key
      - name: Build Tauri app
        working-directory: desktop-tauri
        run: npx tauri build --target ${{ matrix.target }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # macOS: Re-sign with hardened runtime + timestamp (required for notarization)
      # then recreate the DMG, notarize, and staple
      - name: Sign, notarize, and staple macOS app
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH=$(find desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -1)
          DMG_DIR="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          DMG_PATH=$(find "$DMG_DIR" -name "*.dmg" | head -1)
          DMG_NAME=$(basename "$DMG_PATH")

          echo "Re-signing $APP_PATH with hardened runtime..."
          codesign --deep --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          echo "Recreating DMG with Applications shortcut..."
          rm -f "$DMG_PATH"
          DMG_STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "zenmode" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_PATH"
          rm -rf "$DMG_STAGING"

          echo "Notarizing $DMG_PATH..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 15m

          echo "Stapling..."
          xcrun stapler staple "$DMG_PATH"
          echo "Done: signed, notarized, and stapled."

      - name: List bundle output (macOS)
        if: contains(matrix.platform, 'macos')
        run: |
          echo "=== DMG ==="
          ls -la desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ || true
          echo "=== macOS ==="
          ls -la desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ || true

      - name: Upload artifacts (macOS)
        if: contains(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: zenmode-${{ matrix.label }}
          path: |
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig

      - name: Upload artifacts (Windows)
        if: contains(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: zenmode-${{ matrix.label }}
          path: |
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' desktop-tauri/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: List all artifacts
        run: find artifacts/ -type f | sort

      - name: Generate latest.json for updater
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${{ steps.version.outputs.version }}
          BASE_URL="https://github.com/leobabauta/zenmode/releases/download/${TAG}"

          # Read signatures (files are in subdirectories like macos/ or nsis/)
          MAC_ARM_SIG=$(find artifacts/zenmode-macOS-arm64 -name "*.sig" -exec cat {} \; 2>/dev/null || echo "")
          MAC_X64_SIG=$(find artifacts/zenmode-macOS-x64 -name "*.sig" -exec cat {} \; 2>/dev/null || echo "")
          WIN_SIG=$(find artifacts/zenmode-Windows-x64 -name "*.exe.sig" -exec cat {} \; 2>/dev/null || echo "")

          # Find actual tar.gz/zip filenames
          MAC_ARM_TAR=$(find artifacts/zenmode-macOS-arm64 -name "*.tar.gz" | head -1 | xargs basename 2>/dev/null || echo "zenmode.app.tar.gz")
          MAC_X64_TAR=$(find artifacts/zenmode-macOS-x64 -name "*.tar.gz" | head -1 | xargs basename 2>/dev/null || echo "zenmode.app.tar.gz")
          WIN_EXE=$(find artifacts/zenmode-Windows-x64 -name "*.exe" ! -name "*.sig" | head -1 | xargs basename 2>/dev/null || echo "zenmode_${VERSION}_x64-setup.exe")

          echo "MAC_ARM_SIG=${MAC_ARM_SIG:0:20}..."
          echo "MAC_X64_SIG=${MAC_X64_SIG:0:20}..."
          echo "WIN_SIG=${WIN_SIG:0:20}..."
          echo "MAC_ARM_TAR=$MAC_ARM_TAR"
          echo "MAC_X64_TAR=$MAC_X64_TAR"
          echo "WIN_EXE=$WIN_EXE"

          cat > artifacts/latest.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Update to zenmode ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "${BASE_URL}/${MAC_ARM_TAR}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE_URL}/${MAC_X64_TAR}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/${WIN_EXE}"
              }
            }
          }
          ENDJSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sig
            artifacts/latest.json
          generate_release_notes: true
