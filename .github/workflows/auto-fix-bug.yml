name: Auto-Fix Bug Report

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number'
        required: true
      bug_description:
        description: 'Bug description from user'
        required: true

jobs:
  triage-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Triage and fix with Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are triaging and fixing a bug report for the zenmode app (Issue #${{ inputs.issue_number }}).

            Bug report from user:
            ${{ inputs.bug_description }}

            Instructions:
            1. First, check existing GitHub Issues (labels: bug) to see if this is a duplicate. Use `gh issue list --label bug --state all --limit 50` to search. If it's a duplicate of an existing issue, comment on Issue #${{ inputs.issue_number }} explaining which issue it duplicates, close it with `gh issue close ${{ inputs.issue_number }} --reason "not planned" --comment "Duplicate of #X"`, and stop.

            2. If not a duplicate, investigate the codebase to understand the bug. Read CLAUDE.md for project context. The web app is at src/, mobile at mobile/, shared code at shared/, Supabase Edge Functions at supabase/functions/.

            3. Assess if this bug is fixable with a code change. If it's a configuration issue, user error, or requires information you don't have, comment on the issue explaining why it can't be auto-fixed and add the label "needs-manual-fix" with `gh issue edit ${{ inputs.issue_number }} --add-label "needs-manual-fix"`.

            4. If fixable, make the fix. Run `npx tsc --noEmit` to verify the web app type-checks. Run `cd mobile && npx tsc --noEmit` for mobile changes.

            5. If the fix is successful, commit your changes to a new branch named `auto-fix/issue-${{ inputs.issue_number }}`. Then create a PR that closes the issue:
               ```
               gh pr create --title "fix: <concise description>" --body "Fixes #${{ inputs.issue_number }}\n\n<description of what was wrong and how it was fixed>\n\n---\n_Auto-generated fix from bug report._"
               ```

            6. After creating the PR, enable auto-merge: `gh pr merge auto-fix/issue-${{ inputs.issue_number }} --auto --squash`

            Be conservative — only fix things you're confident about. A wrong fix is worse than no fix.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          model: "sonnet"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
