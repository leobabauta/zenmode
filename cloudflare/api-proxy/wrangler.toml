name = "zenmode-api-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
SUPABASE_URL = "https://hlyxiyvqmfupyqjgfajj.supabase.co"

# A Custom Domain rather than a route: the worker owns this whole hostname, and
# `wrangler deploy` creates the DNS record and provisions the certificate itself.
# A plain route would need a proxied DNS record to already exist. Note there is
# no `/*` here — a custom domain sends every path on the hostname to the worker.
[[routes]]
pattern = "api.zenmode.work"
custom_domain = true
