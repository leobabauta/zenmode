name = "zenmode-api-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
SUPABASE_URL = "https://hlyxiyvqmfupyqjgfajj.supabase.co"

# api.zenmode.work must exist as a DNS record in the zenmode.work zone before
# `wrangler deploy` can attach this route. A proxied (orange-cloud) AAAA record
# pointing at 100:: is the usual placeholder for a Workers-only hostname.
[[routes]]
pattern = "api.zenmode.work/*"
zone_name = "zenmode.work"
