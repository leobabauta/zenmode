<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tester Feedback - zenmode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafafa;
      color: #1c1917;
      line-height: 1.7;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.25rem 2rem;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #1c1917;
    }
    .nav-logo img { width: 2.5rem; height: 2.5rem; }
    .nav-logo span { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; }
    .nav-links a {
      font-size: 0.875rem;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none;
    }
    .nav-links a:hover { color: #1d4ed8; }

    .hero {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #1c1917;
      margin-bottom: 0.75rem;
    }
    .hero .subtitle {
      font-size: 1.05rem;
      color: #78716c;
    }

    .content {
      max-width: 580px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .form-card {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 2rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #44403c;
      margin-bottom: 0.35rem;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1c1917;
      background: #fafafa;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .field textarea {
      min-height: 120px;
      resize: vertical;
    }
    .submit-btn {
      width: 100%;
      padding: 0.75rem;
      background: #1c1917;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .submit-btn:hover { background: #292524; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-msg {
      text-align: center;
      padding: 2rem;
    }
    .success-msg h3 {
      font-size: 1.25rem;
      color: #1c1917;
      margin-bottom: 0.5rem;
    }
    .success-msg p {
      color: #78716c;
      font-size: 0.95rem;
    }
    .success-msg a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .success-msg a:hover { text-decoration: underline; }
    .error-msg {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    footer {
      border-top: 1px solid #e7e5e4;
      padding: 2rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    footer a {
      font-size: 1rem;
      color: #78716c;
      text-decoration: none;
    }
    footer a:hover { color: #1c1917; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">
      <img src="/zenmode-logo.svg" alt="" />
      <span>zenmode</span>
    </a>
    <div class="nav-links">
      <a href="/about/">About</a>
      <a href="/manifesto/">Manifesto</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Tester Feedback</h1>
    <p class="subtitle">Thanks for helping test zenmode! Your feedback helps a lot.</p>
  </section>

  <section class="content">
    <div class="form-card" id="feedback-form">
      <form id="fb-form" onsubmit="handleSubmit(event)">
        <div class="field">
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="type">Type of feedback</label>
          <select id="type" name="type" required>
            <option value="" disabled selected>Select one...</option>
            <option value="bug">Bug report</option>
            <option value="problem">Something frustrating or confusing</option>
            <option value="feature">Feature request</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Details</label>
          <textarea id="message" name="message" required placeholder="Describe what happened, what you expected, or what you'd like to see..."></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Submit feedback</button>
        <div class="error-msg" id="error-msg" style="display:none"></div>
      </form>
    </div>

    <div class="form-card success-msg" id="success-msg" style="display:none">
      <h3>Feedback sent!</h3>
      <p>Thanks for taking the time. <a href="/tester-feedback/">Submit another</a></p>
    </div>
  </section>

  <footer>
    <a href="/about/">About</a>
    <a href="/manifesto/">Manifesto</a>
    <a href="/downloads/">Downloads</a>
    <a href="/privacy/">Privacy Policy</a>
  </footer>

  <script>
    const SUPABASE_URL = 'https://hlyxiyvqmfupyqjgfajj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Q55FjkRQddqOTdoqqsr-7w_I8G-CMHN';

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      errorEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value.trim();

      try {
        // Save to Supabase
        const res = await fetch(SUPABASE_URL + '/rest/v1/tester_feedback', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal',
          },
          body: JSON.stringify({ email, type, message }),
        });

        if (!res.ok) throw new Error('Submit failed');

        // Email notification via Edge Function
        fetch(SUPABASE_URL + '/functions/v1/notify-feedback', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, type, message }),
        }).catch(() => {}); // fire and forget

        document.getElementById('feedback-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit feedback';
      }
    }
  </script>
</body>
</html>
